<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>عائشة الذكية</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      /* خلفية بنية فاتحة بالوسط وتغمق تدريجياً نحو الزوايا */
      background: radial-gradient(circle at 50% 42%, #8d6748 0%, #5c3d28 48%, #2a180d 100%);
      color: #fff6ed;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    /* الشريط العلوي */
    header {
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .app-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: #ffe8d1;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .settings-btn {
      background: rgba(255, 232, 209, 0.12);
      border: 1px solid rgba(255, 232, 209, 0.25);
      color: #ffe8d1;
      padding: 6px 12px;
      border-radius: 14px;
      font-size: 0.85rem;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: 0.2s;
    }

    .settings-btn:active {
      transform: scale(0.95);
    }

    /* منطقة الشخصية بالوسط */
    .character-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 10px;
      min-height: 210px;
    }

    .character-glow {
      position: absolute;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 214, 170, 0.28) 0%, transparent 70%);
      pointer-events: none;
      transition: 0.3s ease;
    }

    .character-img {
      width: 195px;
      height: 195px;
      object-fit: contain;
      z-index: 2;
      filter: drop-shadow(0 15px 25px rgba(20, 10, 4, 0.55));
      animation: idleFloat 3.2s ease-in-out infinite;
      transform-origin: bottom center;
      transition: filter 0.3s ease;
    }

    /* حركة التنفس الطبيعية */
    @keyframes idleFloat {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-6px) scale(1.015); }
    }

    /* حركة الاستماع (تميل راسها بلطف) */
    .character-img.listening {
      animation: listenTilt 1.4s ease-in-out infinite;
      filter: drop-shadow(0 15px 30px rgba(255, 200, 130, 0.45));
    }

    @keyframes listenTilt {
      0%, 100% { transform: rotate(0deg) scale(1.03); }
      35% { transform: rotate(-5deg) scale(1.05); }
      70% { transform: rotate(4deg) scale(1.04); }
    }

    /* حركة الكلام (نطات صغيرة لطيفة متل ماشا) */
    .character-img.speaking {
      animation: happyBounce 0.48s cubic-bezier(0.36, 0.07, 0.19, 0.97) infinite;
      filter: drop-shadow(0 18px 32px rgba(255, 215, 160, 0.5));
    }

    @keyframes happyBounce {
      0%, 100% { transform: translateY(0) scale(1, 1); }
      30% { transform: translateY(-16px) scale(0.97, 1.04) rotate(-2deg); }
      60% { transform: translateY(-4px) scale(1.03, 0.97) rotate(2deg); }
    }

    .status-badge {
      margin-top: 8px;
      font-size: 0.85rem;
      color: #f7dcc2;
      background: rgba(35, 19, 10, 0.45);
      padding: 4px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 224, 190, 0.15);
      z-index: 3;
    }

    /* منطقة عرض الرسائل */
    .chat-box {
      max-height: 26vh;
      overflow-y: auto;
      padding: 8px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 5;
      mask-image: linear-gradient(to bottom, transparent 0%, black 12%, black 100%);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 12%, black 100%);
    }

    .msg {
      max-width: 85%;
      padding: 10px 15px;
      border-radius: 18px;
      font-size: 0.94rem;
      line-height: 1.6;
      word-wrap: break-word;
      animation: popIn 0.25s ease-out;
    }

    @keyframes popIn {
      from { opacity: 0; transform: translateY(8px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .msg.user {
      align-self: flex-start;
      background: rgba(255, 224, 192, 0.18);
      border: 1px solid rgba(255, 224, 192, 0.28);
      color: #fff8f0;
      border-bottom-right-radius: 4px;
    }

    .msg.ai {
      align-self: flex-end;
      background: rgba(34, 18, 9, 0.65);
      border: 1px solid rgba(235, 185, 135, 0.3);
      color: #ffeedc;
      border-bottom-left-radius: 4px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    /* منطقة التحكم السفلية */
    .controls-area {
      padding: 10px 18px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      z-index: 10;
    }

    /* زر المايكروفون الدائري المتوهج نفس الفيديو بألوان متناسقة */
    .mic-wrapper {
      position: relative;
      width: 78px;
      height: 78px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .mic-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #ffdfb8, #c98a55, #6e4427, #f5b97d, #ffdfb8);
      filter: blur(5px);
      opacity: 0.85;
      animation: spinRing 3.5s linear infinite;
      transition: 0.3s ease;
    }

    .mic-wrapper.active .mic-ring {
      animation: spinRing 1.1s linear infinite;
      filter: blur(7px);
      transform: scale(1.12);
      background: conic-gradient(from 0deg, #fff1dc, #ffb36b, #d97b38, #ffe0b5, #fff1dc);
    }

    @keyframes spinRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .mic-inner {
      position: relative;
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #4d311f, #26150b);
      border: 1px solid rgba(255, 224, 185, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      box-shadow: inset 0 2px 8px rgba(255, 220, 180, 0.2);
    }

    .mic-inner svg {
      width: 26px;
      height: 26px;
      stroke: #ffebd6;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* مستطيل إدخال الرسائل الزجاجي الشبيه بالصورة الثانية */
    .input-glass-rect {
      width: 100%;
      max-width: 440px;
      height: 56px;
      border-radius: 18px;
      background: linear-gradient(145deg, rgba(165, 128, 98, 0.28), rgba(75, 48, 30, 0.42));
      border: 1.5px solid rgba(255, 226, 196, 0.28);
      box-shadow:
        inset 0 0 14px rgba(255, 230, 205, 0.16),
        0 8px 24px rgba(18, 9, 4, 0.35);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 10px;
    }

    .input-glass-rect input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff6ed;
      font-size: 0.98rem;
    }

    .input-glass-rect input::placeholder {
      color: rgba(255, 232, 209, 0.55);
    }

    .send-btn {
      background: rgba(255, 220, 185, 0.2);
      border: 1px solid rgba(255, 220, 185, 0.35);
      color: #ffebd6;
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .send-btn:active {
      transform: scale(0.92);
    }

    /* نافذة إعداد مفتاح API */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 8, 4, 0.78);
      backdrop-filter: blur(6px);
      z-index: 50;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.open {
      display: flex;
    }

    .modal-card {
      background: #3a2315;
      border: 1px solid rgba(255, 220, 185, 0.3);
      border-radius: 22px;
      padding: 22px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,0.5);
    }

    .modal-card h3 {
      margin-bottom: 10px;
      color: #ffe6cc;
    }

    .modal-card p {
      font-size: 0.85rem;
      color: #e6c8ac;
      margin-bottom: 14px;
      line-height: 1.5;
    }

    .modal-card input {
      width: 100%;
      padding: 11px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 220, 185, 0.3);
      background: rgba(25, 14, 8, 0.6);
      color: #fff;
      margin-bottom: 14px;
      outline: none;
      direction: ltr;
    }

    .modal-card button {
      background: #c98a55;
      color: #1f1007;
      font-weight: 700;
      border: none;
      padding: 10px 24px;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
    }
  </style>
</head>
<body>

  <header>
    <div class="app-title">✨ عائشة الذكية</div>
    <button class="settings-btn" onclick="openModal()">⚙️ مفتاح الذكاء</button>
  </header>

  <main class="character-stage">
    <div class="character-glow"></div>
    <!-- ضع صورة الشخصية المفرغة بنفس المجلد باسم aisha.png -->
    <img id="character" src="aisha.png" alt="عائشة الذكية" class="character-img" />
    <div id="status" class="status-badge">أهلاً! اسألني أي مسألة دراسية 🎀</div>
  </main>

  <section id="chatBox" class="chat-box"></section>

  <footer class="controls-area">
    <!-- زر المايكروفون المتوهج -->
    <div id="micBtn" class="mic-wrapper" onclick="toggleVoice()">
      <div class="mic-ring"></div>
      <div class="mic-inner">
        <svg viewBox="0 0 24 24">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" x2="12" y1="19" y2="22"/>
        </svg>
      </div>
    </div>

    <!-- مستطيل كتابة الرسائل الزجاجي -->
    <div class="input-glass-rect">
      <input id="textInput" type="text" placeholder="اكتب سؤالك أو مسألتك هون..." onkeypress="if(event.key==='Enter') sendMessage()" />
      <button class="send-btn" onclick="sendMessage()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </footer>

  <!-- نافذة إدخال مفتاح Gemini API -->
  <div id="apiModal" class="modal">
    <div class="modal-card">
      <h3>مفتاح Gemini API المجاني</h3>
      <p>حط مفتاحك المجاني من Google AI Studio مشان تقدر عائشة تحل أصعب المسائل الرياضية والعلمية بذكاء كامل.</p>
      <input id="apiKeyInput" type="password" placeholder="AIzaSy..." />
      <button onclick="saveApiKey()">حفظ وتشغيل</button>
    </div>
  </div>

  <script>
    const character = document.getElementById('character');
    const statusBadge = document.getElementById('status');
    const chatBox = document.getElementById('chatBox');
    const textInput = document.getElementById('textInput');
    const micBtn = document.getElementById('micBtn');
    const apiModal = document.getElementById('apiModal');
    const apiKeyInput = document.getElementById('apiKeyInput');

    let apiKey = localStorage.getItem('aisha_gemini_key') || '';
    let isListening = false;
    let recognition = null;

    if (!apiKey) {
      setTimeout(() => openModal(), 700);
    }

    function openModal() {
      apiKeyInput.value = apiKey;
      apiModal.classList.add('open');
    }

    function saveApiKey() {
      apiKey = apiKeyInput.value.trim();
      localStorage.setItem('aisha_gemini_key', apiKey);
      apiModal.classList.remove('open');
      speakMasha("هيييه! صرت جاهزة هلأ، يلا ورجيني شو عندك مسائل صعبة لنحلها سوا!");
    }

    function addMessage(text, sender) {
      const div = document.createElement('div');
      div.className = `msg ${sender}`;
      div.textContent = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // إعداد الصوت بنبرة طفولية مرحة وحيوية شبيهة بماشا (دبلجة سبيستون)
    function speakMasha(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      const cleanText = text.replace(/[*#_`~]/g, '');
      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.lang = 'ar-SA';
      utterance.pitch = 1.62; // نبرة طفولية عالية ولطيفة
      utterance.rate = 1.12;  // سرعة حيوية ونشيطة متل ماشا

      const voices = window.speechSynthesis.getVoices();
      const arabicFemale = voices.find(v => v.lang.includes('ar') && (v.name.includes('Female') || v.name.includes('Laila') || v.name.includes('Salma') || v.name.includes('Mariam'))) 
                        || voices.find(v => v.lang.includes('ar'));
      if (arabicFemale) utterance.voice = arabicFemale;

      utterance.onstart = () => {
        character.classList.remove('listening');
        character.classList.add('speaking');
        statusBadge.textContent = 'عم تحكي... ✨';
      };

      utterance.onend = () => {
        character.classList.remove('speaking');
        statusBadge.textContent = 'جاهزة لسؤالك الجاي 🎀';
      };

      utterance.onerror = () => {
        character.classList.remove('speaking');
      };

      window.speechSynthesis.speak(utterance);
    }

    // إعداد التعرف على الصوت (المايكروفون)
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'ar-SY';
      recognition.interimResults = false;

      recognition.onstart = () => {
        isListening = true;
        micBtn.classList.add('active');
        character.classList.remove('speaking');
        character.classList.add('listening');
        statusBadge.textContent = 'عم اسمعك... احكي 👂';
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        textInput.value = transcript;
        sendMessage();
      };

      recognition.onend = () => {
        isListening = false;
        micBtn.classList.remove('active');
        character.classList.remove('listening');
        if (!character.classList.contains('speaking')) {
          statusBadge.textContent = 'جاهزة 🎀';
        }
      };

      recognition.onerror = () => {
        isListening = false;
        micBtn.classList.remove('active');
        character.classList.remove('listening');
        statusBadge.textContent = 'ما سمعت منيح، جرب مرة تانية!';
      };
    }

    function toggleVoice() {
      if (!recognition) {
        alert('متصفحك ما بيدعم المايكروفون المباشر، جرب متصفح كروم.');
        return;
      }
      window.speechSynthesis.cancel();
      if (isListening) {
        recognition.stop();
      } else {
        recognition.start();
      }
    }

    async function sendMessage() {
      const text = textInput.value.trim();
      if (!text) return;

      addMessage(text, 'user');
      textInput.value = '';
      statusBadge.textContent = 'عم فكر بالحل... 🤔';

      if (!apiKey) {
        const msg = 'حط مفتاح Gemini API من زر الإعدادات فوق مشان أقدر حللك كل المسائل!';
        addMessage(msg, 'ai');
        speakMasha(msg);
        return;
      }

      try {
        const systemPrompt = `أنتِ "عائشة الذكية"، مساعدة دراسية ذكية جداً ولطيفة، تتكلمين بأسلوب طفولي مرح، عفوي، وفضولي يشبه شخصية "ماشا" في دبلجة سبيستون (مثل استخدام عبارات لطيفة ومشجعة)، ولكن عندما تشرحين مسألة دراسية (رياضيات، فيزياء، كيمياء، علوم، لغات) تشرحينها بوضوح تام وخطوات مرتبة وسهلة الفهم بدون تعقيد. اجعلي ردودك مختصرة وواضحة لتناسب القراءة الصوتية.`;

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${AQ.Ab8RN6JasMi30Dci10prTvTf7IkUKhWdP4rgLHu0bYvdGt4EdQ}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [{ text: `${systemPrompt}\n\nسؤال المستخدم: ${text}` }]
            }]
          })
        });

        const data = await response.json();
        const reply = data?.candidates?.[0]?.content?.parts?.[0]?.text || 'أوه! صار خطأ صغير، جرب تسألني مرة تانية.';

        addMessage(reply, 'ai');
        speakMasha(reply);
      } catch (err) {
        const errMsg = 'يا ويلي! تأكد من الإنترنت أو من مفتاح الـ API وجرب مرة تانية.';
        addMessage(errMsg, 'ai');
        speakMasha(errMsg);
      }
    }
  </script>
</body>
  </html>
